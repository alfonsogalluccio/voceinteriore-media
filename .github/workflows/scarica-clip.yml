name: Scarica clip (Pixabay o Pexels)
# Parte quando qualcuno (o l'attività serale) scrive richieste in clips/richieste.json, oppure a mano da "Actions".
on:
  push:
    branches: [main]
    paths: [clips/richieste.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scarica-clip
  cancel-in-progress: false
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Installa ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Scarica e prepara le clip
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 tools/pexels_scarica.py
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "voceinteriore-bot"
          git config user.email "voceinteriore-bot@users.noreply.github.com"
          git add clips/
          git diff --cached --quiet && exit 0
          git commit -m "Nuove clip scaricate in automatico (da verificare)"
          git pull --rebase origin main
          git push origin HEAD:main
